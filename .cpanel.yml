---
# Telepites a cPanel Git Version Control "Deploy HEAD Commit" gombjara.
# A tarolo maga az alkalmazas: /home/forgatag/public_html/forgatag2027 (helyben fut, nincs masolas).
# A vendor/ a taroloban van — a szerveren composer NEM fut.
deployment:
  tasks:
    # --- PHP utvonala (meres 2026-10-12: ez 8.4.26; intl NINCS benne, de a parancssori lepesekhez nem kell).
    #       Alternativa: /opt/alt/php84/usr/bin/php (CloudLinux, 8.4.26, intl VAN) — a web is ezt a fajtat hasznalja.
    - export PHP=/opt/cpanel/ea-php84/root/usr/bin/php
    # Meres a naploba: melyik PHP fut, es aktiv-e az intl / proc_open (1 = igen, 0 = nem).
    - $PHP -r 'echo "PHP ", PHP_VERSION, " intl=", (int) extension_loaded("intl"), " proc_open=", (int) function_exists("proc_open"), " zip=", (int) class_exists("ZipArchive"), " gd=", (int) extension_loaded("gd"), PHP_EOL;'

    # A webszerver csak szokasos jogokkal lat be (a klonozas 0700-zal hozza letre). A .git/ kimarad.
    - /usr/bin/find . -path ./.git -prune -o -type d -exec /bin/chmod 755 {} +
    - /usr/bin/find . -path ./.git -prune -o -type f -exec /bin/chmod 644 {} +

    # A beallitas-gyorsitotar torlese ELOSZOR — kulonben a forgatag:admin nem latna a .env-et.
    # (NEM optimize:clear: az az adatbazisbeli cache-tablat is uritene, ami ures adatbazisnal meg nem letezik.)
    - $PHP artisan config:clear
    # A csomaglista (bootstrap/cache/packages.php) NINCS a taroloban: uj composer-csomag utan (pl. Curator) a
    # szerveren a REGI lista maradna, es az uj csomag szolgaltatoja nem toltodne be (2026-10-28: "No hint path
    # defined for [curator]" -> 500 a Mediatar lapjan). Ezert minden telepiteskor ujrairjuk.
    - $PHP artisan package:discover
    - $PHP artisan migrate --force
    # Torzsadatok a seed/ mappabol — CSAK ures tablaba ir, a masodik futastol mar csak kihagy.
    - $PHP artisan forgatag:torzsadatok
    # A tema CSS-fajlja (a nevben a tartalom lenyomata) — a generator-valtozas utan itt irodik ki.
    - $PHP artisan forgatag:tema-css
    - $PHP artisan forgatag:admin
    - $PHP artisan filament:optimize
    - $PHP artisan optimize
    # A mediatar: az arculat fajljai az Arculat gyujtemenybe + a 2026-os kepanyag behozatala, HA a felhasznalo
    # feltoltotte a csomagot (storage/app/import-2026/*.zip). Csomag nelkul csak kihagy; mar bent levo kepnel csak
    # ellenoriz. SZANDEKOSAN az utolso lepes: ha hiany/hiba van, hibaval all meg (a jelentes a mediatar lapjan).
    # Zip-kezelo kell hozza: az ea-php84-ben NINCS (merve 2026-10-28: zip=0), a CloudLinux alt-php84-ben (a web
    # PHP-ja, Select PHP Version) VAN. Ha az alt-php84 tud zip-et, azzal fut; ha nem, az ea-php84-gyel (akkor a
    # zip-eket a Fajlkezeloben kell kicsomagolni: storage/app/import-2026/fajlok/).
    - export ALTPHP=/opt/alt/php84/usr/bin/php
    - if [ -x "$ALTPHP" ] && "$ALTPHP" -r 'exit((int) ! class_exists("ZipArchive"));'; then echo "MEDIATAR - alt-php84, zip VAN"; "$ALTPHP" artisan forgatag:mediatar-import; else echo "MEDIATAR - ea-php84, zip NINCS"; $PHP artisan forgatag:mediatar-import; fi
    # A 2026-os menu, aloldalak (szerkesztheto szovegekkel, videokkal) es a TESZT-hirek — a mediatar UTAN, mert a
    # kepek a mediatar legacy_id-jen at kotodnek. Csak egyszer: a lapok/menuk csak ures tablaba jonnek, a teszthirek
    # jelolese fajlban van (storage/app/import-2026/tartalom.json), hogy az elesites elotti adatbazis-urites utan ne
    # jojjenek vissza. Hianyzo kepnel semmit nem ir, hibaval all meg.
    - $PHP artisan forgatag:tartalom-import
